name: Build Keychron B6 Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local config
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Initialize Keychron Workspace
        run: |
          pip3 install west
          # 1. Clonar o repositório oficial da Keychron com o link completo
          git clone -b keychron_bpro https://github.com/keychron/zmk.git zmk-repo
          cd zmk-repo
          
          # 2. Inicialização do manifest local da Keychron
          west init -l app/
          west update
          
          # 3. Injetar as suas 3 linhas personalizadas diretamente no ficheiro oficial do B6 UK
          cd app/boards/shields/keychron/b6/uk
          cat <<EOF >> keychron_b6_uk.conf
          CONFIG_USB_HID_BOOT_PROTOCOL=y
          CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
          CONFIG_ZMK_USB=y
          EOF

      - name: Build firmware
        run: |
          cd zmk-repo/app
          west build -p -b keychron -- -DSHIELD=keychron_b6_uk
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keychron_b6_uk_firmware
          path: zmk-repo/build/zephyr/zmk.uf2
